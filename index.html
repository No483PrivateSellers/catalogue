<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Loja</title>
  <style>
    .card { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; width: 200px; text-align: center; }
    .fav { cursor: pointer; font-size: 20px; }
    .old { text-decoration: line-through; color: gray; display: block; }
    img { width: 150px; height: 150px; cursor: pointer; }
    #filters button { margin: 0 5px; }
  </style>
</head>
<body>

<h1>Produtos</h1>

<!-- Botões de filtro -->
<div id="filters">
  <button onclick="filtrarCategoria('all')">Todos</button>
  <button onclick="filtrarCategoria('hoodie')">Hoodies</button>
  <button onclick="filtrarCategoria('tshirt')">T-Shirts</button>
  <button onclick="filtrarCategoria('sapatos')">Sapatos</button>
  <button onclick="filtrarCategoria('casaco')">Casacos</button>
</div>

<!-- Container de produtos -->
<div id="products"></div>

<!-- Botão WhatsApp -->
<button onclick="enviarWhatsApp()">Enviar WhatsApp</button>

<script src="script.js"></script>
</body>
</html>
