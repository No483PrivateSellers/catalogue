<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Loja</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #eee;
    }

    header h2 { margin: 0; }
    header button {
      background: #eee;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    #filtros {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: white;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    #filtros button {
      background: #f5f5f5;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      padding: 12px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 10px;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card img {
      width: 100%;
      max-width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }

    .fav {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    .new {
      position: absolute;
      top: 10px;
      right: 10px;
      background: grey;
      color: white;
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 12px;
    }

    .card p {
      margin: 10px 0 5px;
      font-weight: 500;
      text-align: center;
    }

    .card span {
      display: block;
      font-weight: bold;
      text-align: center;
    }

    .old {
      color: red;
      margin-top: 3px;
      font-size: 14px;
      text-decoration: line-through;
    }

    .hidden { display: none; }

    #whatsapp {
      margin: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background: #25d366;
      color: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<header>
  <h2>Minha Loja</h2>
</header>

<div id="filtros">
  <button onclick="filtrarCategoria('all')">Todos</button>
  <button onclick="filtrarCategoria('hoodie')">Hoodies</button>
  <button onclick="filtrarCategoria('tshirt')">T-Shirts</button>
  <button onclick="filtrarCategoria('sapatos')">Sapatos</button>
  <button onclick="filtrarCategoria('casaco')">Casacos</button>
</div>

<div id="products"></div>

<button id="whatsapp" onclick="enviarWhatsApp()">Enviar WhatsApp</button>

<script src="script.js"></script>
</body>
</html>
