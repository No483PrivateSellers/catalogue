<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>No.483PrivateSellers - Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2 id="loja-title">No. 483 Private Sellers - Catalogue</h2>

  <!-- Seletor de idioma -->
  <select id="language" onchange="mudarIdioma(this.value)">
    <option value="pt">PT</option>
    <option value="en">EN</option>
  </select>

  <button onclick="toggleFiltros()">Filtros</button>
</header>

<div id="filtros" class="hidden">
  <button onclick="filtrarCategoria('all')">Todos</button>
  <button onclick="filtrarCategoria('clothes')">Clothes</button>
  <button onclick="filtrarCategoria('sneakers')">Sneakers</button>
  <button onclick="filtrarCategoria('accessories')">Accessories</button>
</div>

<div id="products" class="grid"></div>

<button id="whatsapp" onclick="enviarWhatsApp()">Enviar WhatsApp</button>

<script src="script.js"></script>
</body>
</html>
